[project]
name = "signals"
version = "0.1.0"
description = "Signals engine: watches UK public registers for trigger events and produces weekly sales-lead digests."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
signals = "signals.cli:app"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
